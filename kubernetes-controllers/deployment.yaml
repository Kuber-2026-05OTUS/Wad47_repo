apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-deployment
  namespace: homework
  labels:
    app: homework-2
spec:
# Количество экземпляров подов
  replicas: 3
  selector:
    matchLabels:
      app: homework-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # Количество поддов, которое можно создать сверх желаемого числа (можно указать в %)
      maxUnavailable: 1 # Максимальное количество недоступных подов во время обновления
# ---- Шаблон пода ----
  template:
    metadata:
      labels:
        app: homework-server
    spec:
      # Запуск подов на нодах с определенной меткой 
      nodeSelector:
        homework: "true"    # Указываем метку и её значение 
      #временное хранилище
      volumes:
        - name: shared-volume
          emptyDir: {}
      initContainers:
        - name: init-homework-server
          image: busybox:1.28
          # Временные переменные MY_POD_NAME MY_POD_NAMESPACE MY_NODE_NAME
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Создание файла              
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /init
              echo "<html><head><title>Homework-WEB</title></head><body><h1>Hello from container from POD - $(MY_POD_NAME) in NODE - $(MY_NODE_NAME), in namespase  - $(MY_POD_NAMESPACE)!!</h1></body></html>" > /init/index.html
          #command: ['sh', '-c', 'echo "Hello from Init-Container!" > /init/index.html']
          volumeMounts:
            - name: shared-volume
              mountPath: /init #монтируем в директорию
      containers:
        - name: web-server
          #image: nginx:alpine
          #image: nginx:1.14.2
          image: nginx:latest
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: shared-volume
              mountPath: /homework #монтируем в директорию
          # Создаем символическую ссылку с /homework на стандартную директорию раздачи Nginx или настраиваем его конфиг
          # Переопределяем порт Nginx на 8000
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo 'server {
                listen 8000;
                server_name localhost;
                location / {
                  root /homework;
                  index index.html index.htm;
                }
              }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
          lifecycle:
            # Удаляем файл index.html перед завершением пода
            preStop:
              exec:
               command: ["/bin/sh", "-c", "rm -rf /homework/index.html"]
          # Readiness проба для проверки готовности контейнера "по команде"
          readinessProbe:
            exec:
              command:
                - cat
                - /homework/index.html
            initialDelaySeconds: 5 # Задержка 5 секунд перед первой проверкой
            periodSeconds: 10      # Проверять каждые 10 секунд
            timeoutSeconds: 2      # Количество секунд ожидания пробы
# ---- Конец шаблон пода ----

