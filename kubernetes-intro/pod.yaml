apiVersion: v1
kind: Pod
metadata:
  name: homework-web-server
  namespace: homework
  labels:
    app: homework-server
spec:
  containers:
  - name: nginx
    #image: nginx:1.14.2
    image: nginx:latest
    ports:
    - containerPort: 8000
    volumeMounts:
    - name: homework-volume
      mountPath: /homework